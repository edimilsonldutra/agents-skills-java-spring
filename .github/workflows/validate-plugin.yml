name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate skills, agents, hooks, prompts, evals, links and counts
        run: python3 scripts/validate-plugin.py
      - name: Lint shell scripts
        run: shellcheck -S warning hooks/*.sh scripts/*.sh
      - name: Test hooks
        run: bash scripts/test-hooks.sh
      - name: Compile skill scripts
        run: python3 -m py_compile skills/*/scripts/*.py
